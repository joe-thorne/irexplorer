name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install development environment
        run: python -m pip install -r src/backend/requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type-check
        run: mypy
      - name: Backend suite
        run: python -m unittest discover -s tests
      - name: Study draft check
        run: node scripts/check_study_drafts.mjs
      - name: Study submission check
        run: node scripts/check_study_submission.mjs
