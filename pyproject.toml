# Tool configuration only; irexplorer is run from source, not packaged.

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["examples", "artefacts", ".claude"]

[tool.ruff.lint]
# Explicit selection so the result does not drift with ruff's default set.
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/backend", "scripts"]
explicit_package_bases = true
warn_unused_ignores = true
